[project]
name = "lex-rag"
version = "0.3.0"
description = "MCP server de RAG sobre a base normativa federal brasileira (CF + LC + LO), anti-alucinação."
requires-python = ">=3.12,<3.13"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Artur Lascala" }]

[project.urls]
Repository = "https://github.com/arturlascala/lex-rag"

dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # Pin exato: o formato do Qdrant embedded (data/qdrant/) muda entre versões, e o
    # snapshot do corpus distribuído em Release foi gerado com esta. Ao subir a versão,
    # gere e publique snapshot novo (scripts/snapshot.py criar).
    "qdrant-client==1.18.0",
    "FlagEmbedding>=1.2.10,<1.4",
    "numpy<2.0",
    "torch>=2.2,<2.3",
    "transformers>=4.40,<4.50",
    "sentence-transformers<3.4",
    "mcp>=1.0",
    "structlog>=24.1",
    "tenacity>=8.2",
    # O portal do STF serve cadeia TLS incompleta (só a folha, sem o
    # intermediário GlobalSign); truststore delega a verificação ao store do
    # sistema, que busca o elo faltante por AIA. Ver scripts/descobrir_sumulas.py.
    "truststore>=0.9",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
eval = ["ragas>=0.2", "datasets>=2.20"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
lex-rag-mcp = "lex_rag.mcp_server.server:main"
lex-rag-update = "lex_rag.update.cli:main"
lex-rag-serve = "lex_rag.service.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lex_rag"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# Projeto em pt-BR: travessões e acentos em strings são intencionais.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: tests that require network access (deselect with -m 'not network')",
]
